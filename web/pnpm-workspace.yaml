# pnpm 10+ reads build-script approval from here, not package.json.
allowBuilds:
  # next/image optimization binary.
  sharp: true
  # native module resolver used by eslint-config-next.
  unrs-resolver: true
  # Optional native speedups for `ws`, pulled in by @solana/web3.js. The pure-JS
  # fallback is what actually runs in the browser, so there is nothing to gain
  # from compiling them — and on a clean CI box the compile is what breaks.
  bufferutil: false
  utf-8-validate: false
