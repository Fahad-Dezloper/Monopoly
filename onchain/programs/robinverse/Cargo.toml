[package]
name = "robinverse"
version = "0.1.0"
description = "Onchain Monopoly engine for RobinVerse, running on MagicBlock ephemeral rollups"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "robinverse"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "=1.0.2", features = ["init-if-needed"] }
ephemeral-rollups-sdk = { version = "0.16.2", features = ["anchor", "vrf"] }
